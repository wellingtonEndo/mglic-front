<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Conta</title>
    <link rel="stylesheet" href="/src/login-register/css/style.css">
</head>

<body>
    <main>
        <div id="imagem-lado">

            <img src="/src/assets/imgs/eco-warrior-princess-lUShu7PHIGA-unsplash.jpg" alt="">

        </div>

        <div id="formulario">
            <div class="top">
                <h1>MGLIC</h1>
                <h6>Informações pessoais</h6>
            </div>

            <div class="registro">
                <form action="" method="post">
                    <label for="email">E-mail:</label>
                    <input type="email" name="email" id="email" placeholder="Insira seu e-mail" required>

                    <label for="nome">Nome:</label>
                    <input type="text" name="nome" id="nome" placeholder="Insira seu nome" required>

                    <label for="Sobrenome">Sobrenome:</label>
                    <input type="text" name="Sobrenome" id="Sobrenome" placeholder="Insira seu sobrenome" required>

                    <label for="data-nascimento">Data de Nascimento:</label>
                    <input type="date" name="data-nascimento" id="data-nascimento" required>

                    <label for="telefone">Telefone:</label>
                    <input type="tel" name="telefone" id="telefone" placeholder="Insira seu telefone" required>

                    <button type="submit">
                        <p>Next</p>
                    </button>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
